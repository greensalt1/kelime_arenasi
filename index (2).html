<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Kelime Arenası</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#0b1f24;--panel:rgba(8,24,29,.92);--brass:#d9a441;--brass2:#f0c56a;--txt:#efeadd;--mut:#9fb2b5;--c:#3aa56b;--y:#d9a441;--a:#4b565c;--p1:#2d7ff9;--p2:#f2994a;
--cp:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
--cpi:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);
--cp8:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
--cp6:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--txt);font-family:Barlow,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--brass2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.55))}

/* skor tabelası */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;gap:8px;pointer-events:none;transition:opacity .5s}
#score{display:flex;gap:8px;counter-reset:pl}
.pc{counter-increment:pl;display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;align-items:center;min-width:158px;padding:7px 14px 7px 8px;background:var(--panel);clip-path:var(--cp8);opacity:.62}
.pc::before{content:counter(pl);grid-row:1/3;display:grid;place-items:center;width:32px;height:32px;background:var(--pc);color:#08141a;font:700 19px Oswald,sans-serif}
.pc b{grid-column:2;font-weight:700;font-size:14px;line-height:1.15}
.pc i{grid-column:2;grid-row:2;font-style:normal;font-size:11px;font-weight:700;color:var(--mut);min-height:13px;line-height:1}
.pc span{grid-column:3;grid-row:1/3;font:700 27px Oswald,sans-serif;font-variant-numeric:tabular-nums}
.pc.on{opacity:1;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent 70%),var(--panel);box-shadow:inset 0 -3px 0 var(--pc)}
.pc.on i{color:var(--brass2)}
#info{display:flex;gap:6px;align-items:center;pointer-events:auto}
#rd,#xbtn,#mute{padding:8px 12px;background:var(--panel);clip-path:var(--cp8);font-weight:700;font-size:14px;white-space:nowrap}
#xbtn:hover,#mute:hover{background:#12363e}
#banner{position:fixed;left:50%;top:24%;transform:translate(-50%,-24px);padding:12px 56px;font:700 34px Oswald,sans-serif;color:#08141a;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 50%,100% 100%,0 100%,22px 50%);opacity:0;pointer-events:none;transition:all .35s;z-index:6;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--panel);border-left:5px solid var(--brass);padding:10px 18px;font-weight:700;text-align:center;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;line-height:1.6;clip-path:var(--cp8)}
#toast.show{opacity:1}

/* alt panel: joker ve klavye */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:7px;background:linear-gradient(transparent,rgba(6,18,22,.94) 40%);transition:opacity .5s}
body.cine #bottom,body.cine #hud{opacity:0;pointer-events:none}
#jk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.jl{font-weight:700;font-size:13px;color:var(--pc);padding-right:6px}
#jk button{background:#16343b;border-top:3px solid var(--pc);padding:7px 12px 6px;font-weight:700;font-size:13px;clip-path:var(--cp6)}
#jk button:hover:not(:disabled){background:#1d4651}
#jk button:disabled{opacity:.35;cursor:default;text-decoration:line-through}
#kb{width:100%;max-width:560px;display:flex;flex-direction:column;gap:5px}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;max-width:48px;height:46px;background:#2b5560;border-radius:5px;box-shadow:0 3px 0 #163239;font-weight:700;font-size:17px;padding:0}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 #163239}
.k.w{max-width:78px;font-size:13px}
.k[data-k=ENTER]{background:var(--brass);color:#241a00;box-shadow:0 3px 0 #8c6a22}
.k.c{background:var(--c);box-shadow:0 3px 0 #1f6b40}
.k.p{background:var(--y);color:#241a00;box-shadow:0 3px 0 #8c6a22}
.k.a{background:#14262b;color:#6d7b80;box-shadow:0 3px 0 #0a1518}
.k.x{background:#14262b;color:#516066;text-decoration:line-through;box-shadow:0 3px 0 #0a1518}

/* paneller */
.ov{position:fixed;inset:0;display:flex;background:rgba(5,15,19,.84);z-index:10;padding:16px;overflow:auto}
.ov>*{margin:auto}
.ov.hide{display:none}
.card{position:relative;max-width:440px;width:100%;padding:28px 26px;text-align:center;line-height:1.5;background:var(--brass);clip-path:var(--cp)}
.card::before{content:"";position:absolute;inset:3px;background:#0e2a31;clip-path:var(--cpi);z-index:0}
.card>*{position:relative;z-index:1}
.card h1{margin:0 0 6px;font:700 42px/1.05 Oswald,sans-serif;color:var(--brass2)}
.card h2{margin:0 0 2px;font:700 30px/1.1 Oswald,sans-serif;color:var(--brass2)}
.card p{margin:6px 0 12px;font-size:16px}
.card.tk{text-align:left}
.grp,.sg{margin:16px 0 0;text-align:left}
.grp>span,.sg>span{display:block;font-weight:700;font-size:14px;color:var(--mut);margin-bottom:7px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;background:#16343b;box-shadow:inset 0 0 0 2px #2a5560;font:700 20px Oswald,sans-serif;clip-path:var(--cp6)}
.seg.wide button{font:700 16px Barlow,sans-serif}
.seg button:hover{background:#1d4651}
.seg button[aria-pressed=true]{background:var(--brass);color:#241a00;box-shadow:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.dot.a{background:var(--p1)}.dot.b{background:var(--p2)}
.pv{display:flex;gap:4px;margin-top:9px}
.pv i{width:22px;height:22px;background:#17323a;box-shadow:inset 0 0 0 2px #2c5560}
#sum{margin:18px 0 0;padding-top:14px;border-top:2px dashed rgba(217,164,65,.45);font-weight:700;font-size:15px;color:var(--brass2);min-height:36px}
.go{display:block;width:100%;margin-top:10px;padding:13px 22px;background:var(--brass);color:#241a00;font:700 19px Oswald,sans-serif;letter-spacing:.02em;clip-path:var(--cp8)}
.go:hover{background:var(--brass2)}
.go.alt{background:#173a42;color:var(--txt);box-shadow:inset 0 0 0 2px var(--brass)}
.go.alt:hover{background:#1f4a54}
.fine{margin:12px 0 0!important;font-size:13px!important;color:var(--mut)}
#appeal{width:auto;margin:0;padding:8px 14px;font-size:15px}
#appeal.hide{display:none}

/* ana menü */
#menu{background:linear-gradient(100deg,rgba(5,15,19,.95),rgba(5,15,19,.8) 50%,rgba(5,15,19,.3));backdrop-filter:blur(2px)}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;width:100%;max-width:1040px;align-items:center}
.poster{text-align:left}
.mq{height:10px;margin:14px 0;background:radial-gradient(circle,#ffd98a 3px,transparent 3.6px) 0 0/18px 10px repeat-x;animation:chase 1s steps(2) infinite}
@keyframes chase{to{background-position:18px 0}}
.tt{display:flex;gap:7px;flex-wrap:wrap}
.t{display:grid;place-items:center;width:62px;height:62px;font:700 38px Oswald,sans-serif;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3);animation:flip .7s both;animation-delay:calc(var(--d,0)*.12s + .2s)}
@keyframes flip{from{transform:rotateX(90deg)}to{transform:none}}
.t.g{background:var(--c)}.t.y{background:var(--y);color:#241a00}.t.a{background:var(--a)}
.poster h1{margin:10px 0 0;font:700 clamp(44px,7vw,84px)/.95 Oswald,sans-serif;color:var(--brass2);letter-spacing:.04em}
.tag{margin:8px 0 0;color:var(--mut);font-size:18px;font-weight:700}
.legend{display:flex;flex-direction:column;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.legend .t{width:30px;height:30px;font-size:17px;animation:none;box-shadow:none}

/* final */
#fin{position:fixed;left:0;right:0;bottom:0;padding:22px 16px calc(26px + env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(transparent,rgba(5,15,19,.96) 35%);opacity:0;pointer-events:none;transition:opacity 1s;z-index:7}
#fin.show{opacity:1;pointer-events:auto}
#fin h2{margin:0;font:700 clamp(34px,6vw,60px)/1 Oswald,sans-serif;color:var(--brass2)}
#fin p{margin:10px 0 6px;font-weight:700;line-height:1.7}
#fin .go{display:inline-block;width:auto}

@media (max-width:860px){
 .lobby{grid-template-columns:1fr;gap:16px;max-width:440px}
 .poster{text-align:center}.tt{justify-content:center}
 .t{width:46px;height:46px;font-size:28px}
 .legend{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin-top:12px}
 .legend li{font-size:13px}
 #menu{background:rgba(5,15,19,.9)}
}
@media (max-width:560px){
 .pc{min-width:0;padding:5px 10px 5px 6px;column-gap:8px}.pc b{display:none}.pc::before{width:26px;height:26px;font-size:16px}.pc span{font-size:22px}
 #info{flex-wrap:wrap;justify-content:flex-end;max-width:52%}
 #rd,#xbtn,#mute{padding:6px 8px;font-size:12px}
 .k{height:42px;font-size:15px}
 #banner{font-size:24px;padding:10px 40px}
 .card h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){#banner,#toast,#hud,#bottom,#fin{transition:none}.t,.mq{animation:none}}
</style></head><body>
<div id="vig"></div><div id="hud"><div id="score"></div><div id="info"><div id="rd"></div><button id="xbtn">Çıkış</button><button id="mute">Ses açık</button></div></div>
<div id="banner"></div><div id="toast"></div>
<div id="bottom"><button id="appeal" class="go alt hide"></button><div id="jk"></div><div id="kb"></div></div>
<div id="menu" class="ov"><div class="lobby">
<section class="poster"><div class="mq"></div>
<div class="tt" aria-hidden="true"><span class="t g" style="--d:0">K</span><span class="t y" style="--d:1">E</span><span class="t a" style="--d:2">L</span><span class="t g" style="--d:3">İ</span><span class="t a" style="--d:4">M</span><span class="t y" style="--d:5">E</span></div>
<h1><span class="sr">Kelime </span>ARENASI</h1>
<p class="tag">Türkçe kelime yarışması</p><div class="mq"></div>
<ul class="legend"><li><span class="t g">A</span>Doğru harf, doğru yer</li><li><span class="t y">A</span>Harf var, yeri yanlış</li><li><span class="t a">A</span>Kelimede yok</li></ul></section>
<div class="card tk"><h2>Yarışma kartı</h2>
<div class="grp" data-g="L"><span>Kelime uzunluğu</span><div class="seg"><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button data-v="7">7</button></div><div class="pv" id="pv"></div></div>
<div class="grp" data-g="P"><span>Yarışmacı</span><div class="seg wide"><button data-v="1"><i class="dot a"></i>Tek kişi</button><button data-v="2"><i class="dot a"></i><i class="dot b"></i>İki kişi</button></div></div>
<div class="grp" data-g="T"><span>Tur sayısı</span><div class="seg"><button data-v="1">1</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
<div id="sum"></div><button class="go" id="start">Yarışmaya başla</button>
<p class="fine">6 hakkın var. Her joker maç boyunca bir kez kullanılır.</p></div></div></div>
<div id="end" class="ov hide"><div class="card"><h1 id="et"></h1><p id="em"></p><button class="go" id="nx">Sonraki kelime</button></div></div>
<div id="exit" class="ov hide"><div class="card"><h2 style="font-size:34px;margin-bottom:6px">Yarışmadan çıkış</h2><div id="who" class="sg"><span>Teklifi yapan oyuncu</span><div class="seg wide"><button data-v="0"><i class="dot a"></i>Oyuncu 1</button><button data-v="1"><i class="dot b"></i>Oyuncu 2</button></div></div><button class="go alt" id="xm">Ana menüye dön</button><button class="go alt" id="xd">Beraberlik teklif et</button><button class="go alt" id="xf">Pes et, oyunu terk et</button><button class="go" id="xc">Oyuna devam et</button></div></div>
<div id="ask" class="ov hide" style="z-index:12"><div class="card"><h2 id="aq" style="font-size:26px;line-height:1.25;margin-bottom:10px"></h2><button class="go" id="ay">Kabul ediyorum</button><button class="go alt" id="an">Reddediyorum</button></div></div>
<div id="fin"><h2 id="ft"></h2><p id="fp"></p><button class="go" onclick="location.reload()">Yeniden oyna</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
/* Sözlük: hem cevap havuzu hem de geçerli tahmin listesi */
const POOL={
4:"ELMA KEDİ MASA KAPI KALP AYAK ARPA BANT BOYA DOST NANE OKUL PARA MAVİ ODUN KAYA GECE DERE KAZA KOLA KULE KURT LİRA SARI ÇAKI ÇATI SAAT SOBA TAVA UZAK VİDA YAZI ADAM ALAN ANNE BABA DOLU EKİM ELÇİ HALI ŞİİR ÖĞLE",
5:"ARABA BAHAR BALIK BULUT ÇİÇEK ÇOCUK DENİZ DÜNYA ELMAS EKMEK GÜNEŞ GÖLGE HAYAL İNSAN KİTAP KÖPEK KULAK LİMON MASAL MERAK MEYVE NEFES ORMAN PAZAR RESİM SABAH SAHİL SEVGİ SİYAH SOKAK ŞEKER ŞEHİR TAVUK TAHTA UZMAN VAPUR YAZAR YARIŞ YEMEK YOLCU ZAMAN ÇANTA DOLAP FİDAN HAFTA KAPAK KARGA KAYIK KEMER KIZIL KONAK MAKAS MELEK NOKTA PERDE RADYO SALON SANAT SELAM SINIF SORUN TARLA TATİL TEMİZ YALAN YARIM YAŞAM YILAN ZİRVE BARIŞ BEBEK BİLGİ BÜTÇE CEVAP CEZVE DİLEK DURUM DUVAR ESNAF FİKİR FIRÇA GURUR HALKA HAVUÇ HEDEF KABAK KADIN KALIP KANAT KAVGA KİLİT KOLAY KORKU KUMAŞ KUŞAK MEKAN MUTLU NAMAZ PAMUK REKOR SAKIN SAMAN SEBZE SERİN SOĞAN SUSAM TABAK TAKIM TİLKİ TUZAK VATAN YAYLA YEŞİL KALEM ÇİLEK KİRAZ KAHVE KÖPRÜ ÇEKİÇ SAYGI MÜZİK KEMİK KOYUN ASLAN KAĞIT SABUN SINIR TATLI ÇORBA DALGA ÇELİK ÇAMUR ÇATAL KAŞIK BIÇAK BİBER LAMBA ÖRDEK SEVDA BAHÇE TEPSİ TAVAN TABLO ŞAHİN ÇINAR",
6:"KARPUZ TOPRAK YILDIZ DEFTER KAPLAN BALKON OYUNCU DOKTOR MUTFAK TAVŞAN SİNEMA MACERA KAYMAK MEYDAN HAYVAN DOLMUŞ KARDEŞ BAYRAK YAĞMUR TAKVİM HEDİYE SUNUCU GÖZLÜK KAYNAK YASTIK YORGAN BARDAK KOLTUK",

const SET={};for(const k in POOL){POOL[k]=POOL[k].split(" ");SET[k]=new Set(POOL[k])}
const KB=["ERTYUIOPĞÜ","ASDFGHJKLŞİ","ZCVBNMÖÇ"],LET=KB.join("").split("");
const PC=["#2d7ff9","#f2994a"],PN=[0x2d7ff9,0xf2994a];
const cfg={L:5,P:2,T:3};
let NP=2,L=5,NT=3,rd=0,word="",row=0,cur="",turn=0,busy=true,over=false,hints=[],known=[],scores=[0,0],kstate={},joker=[],muted=false,started=false,lastW="";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Ses (WebAudio ile üretiliyor) ---------- */
let AC,MG;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination)}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,d=.15,type="sine",v=.15,t0=0,f2){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(MG);o.start(t);o.stop(t+d+.03)}
function noise(d=.05,v=.1,fq=2000,t0=0){const a=ac(),b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+t0;s.buffer=b;f.type="bandpass";f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(MG);s.start(t)}
const sfx={
 key:()=>tone(520,.05,"triangle",.07),back:()=>tone(330,.06,"triangle",.06),bad:()=>tone(150,.25,"square",.1,0,110),
 flip:s=>tone(s==="c"?700:s==="p"?470:190,s==="a"?.15:.25,s==="a"?"square":"triangle",s==="a"?.06:.12),
 clap:(d=2,v=1)=>{for(let i=0;i<d*28;i++)noise(.04,.07*v,1800+Math.random()*2600,Math.random()*d)},
 boo:(d=1.4)=>{[0,.04,-.05].forEach(x=>tone(230*(1+x),d,"sawtooth",.05,0,130*(1+x)));noise(d,.03,400)},
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.3,"square",.08,i*.13)),
 lose:()=>{[392,370,349].forEach((f,i)=>tone(f,.45,"sawtooth",.07,i*.45));tone(311,1,"sawtooth",.07,1.35,260)},
 joker:()=>[880,1109,1319,1760].forEach((f,i)=>tone(f,.2,"sine",.09,i*.07)),
 turn:()=>{tone(660,.12,"triangle",.1);tone(880,.18,"triangle",.1,.1)},
 intro:()=>[392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.1,i*.14)),

function murmur(){const a=ac(),b=a.createBuffer(1,a.sampleRate*3,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;s.loop=true;f.type="lowpass";f.frequency.value=420;g.gain.value=.035;s.connect(f).connect(g).connect(MG);s.start()}
$("#mute").onclick=()=>{muted=!muted;if(MG)MG.gain.value=muted?0:1;$("#mute").textContent=muted?"Ses kapalı":"Ses açık"};

/* ---------- Sahne ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.35;document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x07161a);S.fog=new THREE.Fog(0x07161a,22,50);
const cam=new THREE.PerspectiveCamera(56,1,.1,100);let cz=10.5;
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cz=cam.aspect<1?17:10.5;cam.updateProjectionMatrix()}

const SET_EN={},SET_DE={};
for(const k in POOL_EN){POOL_EN[k]=POOL_EN[k].split(" ");SET_EN[k]=new Set(POOL_EN[k])}
for(const k in POOL_DE){POOL_DE[k]=POOL_DE[k].split(" ");SET_DE[k]=new Set(POOL_DE[k])}

const ALL_POOLS={tr:POOL_TR,en:POOL_EN,de:POOL_DE};
const ALL_SETS={tr:SET_TR,en:SET_EN,de:SET_DE};
const ALL_KBS={
  tr:["ERTYUIOPĞÜ","ASDFGHJKLŞİ","ZCVBNMÖÇ"],
  en:["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"],
  de:["QWERTZUIOPÜ","ASDFGHJKLÖÄ","YXCVBNM"]
};

let lang='tr';
const EXT_DICTS={tr:[],en:[],de:[]};

/* Dinamik buton etiketleriyle kbBuild */
kbBuild=function(){
  const lblEnt = lang==='en'?'ENTER':(lang==='de'?'ENTER':'Gönder');
  const lblDel = lang==='en'?'DEL':(lang==='de'?'LÖSCH':'Sil');
  $("#kb").innerHTML=KB.map((r,i)=>`<div class="kr">${i===2?'<button class="k w" data-k="ENTER">'+lblEnt+'</button>':""}${r.split("").map(c=>`<button class="k" data-k="${c}">${c}</button>`).join("")}${i===2?'<button class="k w" data-k="BACK">'+lblDel+'</button>':""}</div>`).join("");
  $("#kb").querySelectorAll("button").forEach(b=>b.onclick=()=>press(b.dataset.k));
};

function setLang(l){
  lang=l;
  for(const k in POOL)delete POOL[k];
  for(const k in SET)delete SET[k];
  const lp=ALL_POOLS[l];
  for(const k in lp){POOL[k]=[...lp[k]];SET[k]=new Set(lp[k])}
  if(EXT_DICTS[l].length)EXT_DICTS[l].forEach(w=>{if(w.length>=4&&w.length<=7&&SET[w.length])SET[w.length].add(w)});
  KB.length=0;ALL_KBS[l].forEach(r=>KB.push(r));
  LET.length=0;KB.join('').split('').forEach(c=>LET.push(c));
  kbBuild();
}

/* AI doğrulama: çok dilli */
const AI_PROMPT={
  tr:w=>'Aşağıdaki kelime Türkçede gerçekten var olan bir kelime mi? Türkçe sözlükte (TDK) yer alan ya da Türkçede yaygın kullanılan kelimeler EVET. Özel isim, kısaltma, uydurma HAYIR. Cevabın yalnızca EVET ya da HAYIR olsun.\nKelime: '+w.toLocaleLowerCase('tr'),
  en:w=>'Is "'+w.toLowerCase()+'" a real English word found in standard dictionaries? Common words, their forms, and loanwords are YES. Proper nouns, abbreviations, made-up words are NO. Answer only YES or NO.',
  de:w=>'Ist "'+w.toLowerCase()+'" ein echtes deutsches Wort aus dem Wörterbuch? Normale Wörter und Formen JA. Eigennamen und Abkürzungen NEIN. Antworte nur JA oder NEIN.'
};
const AI_YES={tr:'EVET',en:'YES',de:'JA'},AI_NO={tr:'HAYIR',en:'NO',de:'NEIN'};

askDict=async function(w){
  const s=await getSample();if(!s)return null;
  try{
    const r=await Promise.race([s(AI_PROMPT[lang](w),{modelTier:'quick',cache:true}),new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),9000))]);
    const tx=(r.text||'').trim().toLocaleUpperCase(lang==='tr'?'tr':'en');
    return tx.startsWith(AI_YES[lang])?true:tx.startsWith(AI_NO[lang])?false:null;
  }catch(e){if(e&&e.code==='not_granted')SAMP=null;return null}
};

/* verify override: çok dilli */
const _fixI=fixI;
fixI=function(w){if(lang!=='tr')return null;return _fixI(w)};

verify=async function(){
  const w=cur,fx=fixI(w);
  if(fx){cur=fx;showRow();return true}
  busy=true;
  const M={tr:['Kelime sözlükte aranıyor...','Türkçe bir kelime değil','sözlükte yok, doğrulanamadı'],
    en:['Looking up word...','is not a valid English word','could not be verified'],
    de:['Wort wird geprüft...','ist kein gültiges deutsches Wort','konnte nicht überprüft werden']};
  toast(M[lang][0],12000);
  const r=await askDict(w);
  if(quit||over)return false;
  if(r===true){okWords.add(w);$('#toast').classList.remove('show');return true}
  bad(r===false?w+' '+M[lang][1]:w+' '+M[lang][2],true);return false
};

/* Oda oluştur (host) */
function createRoom(pass,code){
  return new Promise((resolve,reject)=>{
    const pid='kelimearena-'+code.toLowerCase();
    try{peer=new Peer(pid)}catch(e){reject(e);return}
    let timeout=setTimeout(()=>reject(new Error('timeout')),30000);
    peer.on('open',()=>{
      clearTimeout(timeout);
      resolve(code);
    });
    peer.on('error',e=>{clearTimeout(timeout);reject(e)});
    peer.on('connection',c=>{
      const handler=d=>{
        if(d.t==='join'){
          if(d.p===pass){
            conn=c;
            c.off('data',handler);
            c.send({t:'ok',lang,L:ocfg.L,T:ocfg.T,hostPlayer:localPlayer,hostName:getMyDisplayName()});
            setupNet();
          }else{
            c.send({t:'no'});c.close();
          }
        }
      };
      c.on('data',handler);
      c.on('close',()=>c.off('data',handler));
    });
  })
}

/* Odaya katıl (guest) */
function joinRoom(code,pass){
  return new Promise((resolve,reject)=>{
    const pid='kelimearena-'+code.toLowerCase();
    try{peer=new Peer()}catch(e){reject(e);return}
    const timeout=setTimeout(()=>{peer.destroy();reject(new Error('timeout'))},15000);
    peer.on('open',()=>{
      conn=peer.connect(pid,{reliable:true});
      conn.on('open',()=>{conn.send({t:'join',p:pass})});
      conn.on('data',d=>{
        if(d.t==='ok'){clearTimeout(timeout);setupNet();resolve(d)}
        else if(d.t==='no'){clearTimeout(timeout);peer.destroy();reject(new Error('wrongpass'))}
      });
      conn.on('error',e=>{clearTimeout(timeout);reject(e)});
    });
    peer.on('error',e=>{clearTimeout(timeout);reject(e)});
  })
}

/* Ağ dinleyicileri */

/* ====================== AĞ MESAJ İŞLEYİCİ ====================== */
function onNet(d){
  switch(d.t){
    /* Handshake: Guest hazır olunca Host oyunu başlatır */
    case 'ready':
      if(isHost){
        playerNames[1 - localPlayer] = d.guestName || 'Rakip';
        playerNames[localPlayer] = getMyDisplayName();
        netSend({t:'syncNames',names:playerNames});
        $('#roomWt').classList.add('hide');
        startOnlineGame();
      }
      break;
    case 'syncNames':
      if(d.names){ playerNames = d.names; hud(); refreshAll3DPlayerLabels(); }
      break;

    /* Canlı harf senkronizasyonu */
    case 'syncCur':
      cur=d.cur||'';
      showRow();
      break;

    /* Tahmin & Joker & İtiraz */
    case 'guess': handleRemoteGuess(d); break;
    case 'joker': if(isHost&&turn===(1-localPlayer))execJoker(d.k,1-localPlayer); break;
    case 'appealAsk':
      askRemote('Rakibiniz "'+d.w+'" kelimesini kabul etmenizi istiyor.',
        ()=>{
          okWords.add(d.w);
          netSend({t:'appealOk',w:d.w});
          if(isHost){
            handleRemoteGuess({g:d.w});
          }
        },
        ()=>{netSend({t:'appealNo'});});
      break;
    case 'appealOk':
      toast('Kelime rakip tarafından kabul edildi!');
      okWords.add(d.w);
      if(isHost&&turn===localPlayer){
        cur=d.w;showRow();submit();
      }
      break;
    case 'appealNo':
      toast('Kelime reddedildi');
      break;

    /* Tur & Sonuç */
    case 'round': handleRoundStart(d); break;
    case 'res': handleResult(d); break;
    case 'bad': handleBadGuess(d); break;
    case 'jres': handleJokerResult(d); break;
    case 'rend': handleRoundEnd(d); break;
    case 'fin': handleFinale(d); break;
    case 'toast': toast(d.msg); break;

    /* Çıkış & Beraberlik & Pes */
    case 'askDraw':
      askRemote('Rakibiniz beraberlik teklif ediyor. Kabul ediyor musunuz?',
        ()=>{
          netSend({t:'drawOk'});
          finale({w:[0,1],m:'Beraberlik kabul edildi, kupa ikisinde'});
        },
        ()=>{
          netSend({t:'drawNo'});
        });
      break;
    case 'drawOk':
      toast('Beraberlik teklifi kabul edildi!');
      finale({w:[0,1],m:'Beraberlik kabul edildi, kupa ikisinde'});
      break;
    case 'drawNo':
      toast('Beraberlik teklifi rakip tarafından reddedildi');
      break;

    case 'askMenu':
      askRemote('Rakibiniz ana menüye dönmek istiyor. Kabul ediyor musunuz?',
        ()=>{
          netSend({t:'menuOk'});
          location.reload();
        },
        ()=>{
          netSend({t:'menuNo'});
        });
      break;
    case 'menuOk':
      toast('Rakibiniz kabul etti, menüye dönülüyor...');
      setTimeout(()=>location.reload(), 1000);
      break;
    case 'menuNo':
      toast('Menüye dönme teklifi rakip tarafından reddedildi');
      break;

    case 'forfeit':
      toast('Rakibiniz pes etti! Kazandınız! 🏆', 4000);
      finale({w:[localPlayer],m:'Rakibiniz pes etti, kazandınız!'});
      break;
  }
}

/* --- Host: uzak tahmin işle --- */
async function handleRemoteGuess(d){
  cur=d.g;showRow();
  if(!SET[L].has(cur)&&!okWords.has(cur)){
    const fx=fixI(cur);
    if(fx){cur=fx;showRow()}
    else{
      const r=await askDict(cur);
      if(r===true){okWords.add(cur)}
      else{
        const M={tr:'Türkçe bir kelime değil',en:'is not a valid word',de:'ist kein gültiges Wort'};
        netSend({t:'bad',msg:cur+' '+M[lang],ap:apl[turn]>0});
        cur='';showRow();return
      }
    }
  }
  busy=true;hud();
  const g=cur,res=ev(g,word),r=row;
  const won=g===word,pts=won?(6-r)*100:0;
  if(won)scores[turn]+=pts;
  netSend({t:'res',g,res,r,won,pts,sc:[...scores]});
  await showGuessResult(g,res,r,won,pts);
}

/* --- Guest: sonuç al --- */
async function handleResult(d){
  cur=d.g;showRow();
  scores=d.sc||scores;
  busy=true;hud();
  await showGuessResult(d.g,d.res,d.r,d.won,d.pts);
}

/* --- Joker yürütme (Host tarafında) --- */
function execJoker(k,p){
  if(joker[p]&&joker[p][k])return;
  if(k==='h'){
    const pos=[...Array(L).keys()].filter(i=>!hints[i]&&!known[i]);
    if(!pos.length){
      if(p===localPlayer)toast('Açılacak harf kalmadı');
      else netSend({t:'toast',msg:'Açılacak harf kalmadı'});
      return;
    }
    const i=pos[Math.random()*pos.length|0];
    hints[i]=word[i];showRow();
    const msg='Sunucu: '+(i+1)+'. harf '+word[i];
    toast(msg);
    netSend({t:'jres',k:'h',p,i,c:word[i],msg});
  }
  if(k==='e'){
    const pool=LET.filter(c=>!word.includes(c)&&!kstate[c]).sort(()=>Math.random()-.5).slice(0,6);
    pool.forEach(c=>{kstate[c]='a'});
    $('#kb').querySelectorAll('.k').forEach(b=>{if(pool.includes(b.dataset.k))b.classList.add('x')});
    const msg='Sunucu: 6 yanlış harf elendi';
    toast(msg);
    netSend({t:'jres',k:'e',p,pool,msg});
  }
  if(k==='s'){
    const o=[word],pl=POOL[L];
    while(o.length<Math.min(4,pl.length)){const w=pl[Math.random()*pl.length|0];if(!o.includes(w))o.push(w)}
    let top=32+Math.random()*13|0,rest=100-top,a=Math.random()*rest*.6|0,b=Math.random()*(rest-a)*.7|0;
    const pc=[top,a,b,rest-a-b],ci=Math.random()<.6?0:1+(Math.random()*2|0),ix=[0,1,2,3].filter(i=>i!==ci);
    let q=0;const rows=o.map((w,i)=>[w,i===0?pc[ci]:pc[ix[q++]]]).sort((x,y)=>y[1]-x[1]);
    const msg='Seyirci oyu\n'+rows.map(([w,pr])=>w+' %'+pr).join('\n');
    toast(msg,6000);exc[0]=.5;exc[1]=.4;sfx.clap(1,.5);

}

/* ====================== ORTAK GÖSTERİM FONKSİYONU ====================== */
async function showGuessResult(g,res,r,won,pts){
  const rank={a:1,p:2,c:3};
  setMark(r,turn,true);
  await Promise.all(res.map(async(st,c)=>{
    await sleep(c*270);
    const m=tiles[r][c].m;
    await tw(.17,k=>m.rotation.x=k*1.5708);
    paint(r,c,g[c],st);sfx.flip(st);
    await tw(.17,k=>m.rotation.x=1.5708*(1-k))
  }));
  res.forEach((st,c)=>{
    if(st==='c')known[c]=true;
    if(!kstate[g[c]]||rank[st]>rank[kstate[g[c]]])kstate[g[c]]=st
  });kbPaint();
  const gr=res.filter(x=>x==='c').length,ye=res.filter(x=>x==='p').length;
  if(won){
    over=true;
    exc[0]=1;exc[1]=.35;jump=turn;jt=0;
    sfx.win();sfx.clap(3);confetti();
    bubble(0,SUP[Math.random()*6|0]);bubble(0,SUP[Math.random()*6|0]);
    bubble(1,HEC[Math.random()*6|0]);
    endRound(true,pts)
  }else{
    if(gr>=Math.ceil(L*.6)||(gr>=2&&ye>=2)){exc[0]=1;exc[1]=.15;sfx.clap(1.6);bubble(0,SUP[Math.random()*6|0]);bubble(0,SUP[Math.random()*6|0])}
    else if(gr===0&&ye<=1){exc[1]=1;exc[0]=.1;sfx.boo();bubble(1,HEC[Math.random()*6|0]);bubble(1,HEC[Math.random()*6|0])}
    else{exc[0]=.55;exc[1]=.5;sfx.clap(.9,.5);sfx.boo(.8);bubble(0,SUP[Math.random()*6|0]);bubble(1,HEC[Math.random()*6|0])}
    if(r===5){
      over=true;exc[1]=1;exc[0]=0;sfx.lose();sfx.boo(2);
      bubble(1,HEC[Math.random()*6|0]);bubble(1,HEC[Math.random()*6|0]);
      endRound(false,0)
    }else{
      row++;cur='';turn=(turn+1)%NP;
      if(NP>1){
        const isMyTurn = (turn===localPlayer);
        banner('Sıra '+(isMyTurn?'Sende!':'Rakipte!'),PC[turn]);
        sfx.turn();
      }
      showRow()
    }
  }
  busy=false;hud()
}

/* --- submit override --- */
const _origSubmit=submit;
submit=async function(){
  if(busy||over||!started)return;
  if(!isOnline)return _origSubmit();
  if(turn!==localPlayer)return;

  if(!isHost){
    if(cur.length<L){bad(L+' harf gerekli');return}
    netSend({t:'guess',g:cur});
    busy=true;hud();return
  }

  /* Host: yerel değerlendir */
  if(cur.length<L){bad(L+' harf gerekli');return}
  if(!SET[L].has(cur)&&!okWords.has(cur)&&!await verify())return;
  busy=true;hud();
  const g=cur,res=ev(g,word),r=row;
  const won=g===word,pts=won?(6-r)*100:0;
  if(won)scores[turn]+=pts;
  netSend({t:'res',g,res,r,won,pts,sc:[...scores]});
  await showGuessResult(g,res,r,won,pts)
};

/* --- press override: online sıra kontrolü & canlı senkronizasyon --- */
press=function(k){
  ac();if(busy||over||!started)return;
  if(isOnline&&turn!==localPlayer)return;
  $('#appeal').classList.add('hide');
  if(k==='ENTER')return submit();
  if(k==='BACK'){
    if(cur.length){
      cur=cur.slice(0,-1);
      sfx.back();
      showRow();
      if(isOnline)netSend({t:'syncCur',cur});
    }
    return
  }
  if(cur.length<L){
    cur+=k;
    sfx.key();
    showRow();
    const m=tiles[row][cur.length-1].m;
    tw(.14,x=>m.scale.setScalar(1.18-.18*x));
    if(isOnline)netSend({t:'syncCur',cur});
  }
};

/* --- newRound override --- */
const _origNewRound=newRound;
newRound=function(){
  if(!isOnline)return _origNewRound();
  if(isHost){
    rd++;const pool=POOL[L];let w;
    do{w=pool[Math.random()*pool.length|0]}while(w===lastW&&pool.length>1);
    word=lastW=w;row=0;cur='';hints=[];known=[];kstate={};over=false;busy=false;jump=-1;
    turn=(rd-1)%NP;
    buildBoard();$('#kb').querySelectorAll('.k').forEach(b=>b.classList.remove('c','p','a','x'));hud();
    netSend({t:'round',rd,trn:turn,L});
    const isMyTurn = (turn===localPlayer);
    banner('Tur '+rd+': '+(isMyTurn?'Sen başlıyorsun!':'Rakip başlıyor!'),PC[turn]);sfx.turn();showRow()
  }
};

/* --- useJoker override --- */
const _origUseJoker=useJoker;
useJoker=function(k){
  if(!isOnline)return _origUseJoker(k);
  if(busy||over||(joker[turn]&&joker[turn][k]))return;
  if(turn!==localPlayer)return;
  ac();
  if(isHost){
    execJoker(k,localPlayer);
  }else{
    netSend({t:'joker',k});
  }
};

/* --- endRound override --- */
const _origEndRound=endRound;
endRound=async function(win,pts){
  if(isOnline&&isHost){
    netSend({t:'rend',win,word,pts,sc:[...scores],winner:turn})
  }
  hud();await sleep(2200);if(quit)return;
  const isMe = (turn===localPlayer);
  const winnerName = isOnline ? (isMe ? 'Harika! Kelimeyi buldun' : (playerNames[turn] || 'Rakip') + ' buldu!') : (playerNames[turn] || 'Oyuncu ' + (turn+1)) + ' buldu!';
  $('#et').textContent=win ? winnerName : 'Kimse bulamadı';
  $('#em').innerHTML='Kelime: <b>'+word+'</b>'+(win?'<br>'+pts+' puan kazandı':'');
  if(isOnline&&!isHost){
    $('#nx').textContent=rd>=NT?'Ev sahibi bekleniyor...':'Ev sahibi bekleniyor...';
    $('#nx').disabled=true;
  }else{
    $('#nx').textContent=rd>=NT?'Finale geç':'Sonraki kelime';
    $('#nx').disabled=false;
  }
  $('#end').classList.remove('hide');jump=-1
};

/* --- finale override --- */
const _origFinale=finale;
finale=function(f){
  if(isOnline&&isHost&&!f){
    netSend({t:'fin',sc:[...scores]})
  }
  return _origFinale(f)
};

/* --- hud override: online & karakter adları --- */
const _origHud=hud;
hud=function(){
  _origHud();
  document.querySelectorAll('.pc').forEach((pc,i)=>{
    const b=pc.querySelector('b');
    if(b){
      if(isOnline){
        const isMe=(i===localPlayer);
        const pName = playerNames[i] || (isMe ? getMyDisplayName() : 'Rakip');
        b.textContent = pName + (isMe ? ' (Sen)' : ' (Rakip)');
      } else {
        const pName = (i === 0) ? getMyDisplayName() : (playerNames[i] || ('Oyuncu ' + (i+1)));
        b.textContent = pName;
      }
    }
    const it=pc.querySelector('i');
    if(it&&i===turn&&!over){
      if(isOnline){
        it.textContent=(i===localPlayer)?'Senin sıran':'Rakip oynuyor';
      } else {
        const pName = (i === 0) ? getMyDisplayName() : (playerNames[i] || ('Oyuncu ' + (i+1)));
        it.textContent = (NP === 1) ? 'Sırada' : (pName + ' oynuyor');
      }
    }
  });
  if(isOnline){
    const jl=document.querySelector('.jl');
    if(jl)jl.textContent=(turn===localPlayer)?'Senin Jokerlerin':'Rakibin Jokerleri';
  }
};

/* Fiziksel klavye Capture Phase dinleyicisi: form input koruması & çok dilli büyük harf desteği */
window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')){
    e.stopPropagation();return
  }
  if(!started||over||busy)return;
  if(isOnline&&turn!==localPlayer)return;

  if(e.key==='Enter'){
    e.stopImmediatePropagation();
    e.preventDefault();
    press('ENTER');
  }else if(e.key==='Backspace'){
    e.stopImmediatePropagation();
    e.preventDefault();
    press('BACK');
  }else if(e.key.length===1){
    let u=e.key;
    if(lang==='tr'){
      u=u.toLocaleUpperCase('tr');
    }else{
      u=u.toUpperCase();
    }
    if(LET.includes(u)){
      e.stopImmediatePropagation();
      e.preventDefault();
      press(u);
    }
  }
},true);

/* 5. HESAP, LEVEL & VERİTABANI MOTORU */
function genPlayerId(existingSet) {
  let id;
  do {
    const num = Math.floor(10000 + Math.random() * 90000);
    id = '#WRD-' + num;
  } while (existingSet && existingSet.has(id));
  return id;
}

const AccountSystem = {
  DB_KEY: 'KA_USERS_CLOUD_DB_V1',
  CUR_KEY: 'KA_ACTIVE_USER_EMAIL',
  LAST_KEY: 'KA_REMEMBERED_LAST_EMAIL',
  VAULT_KEY: 'KA_GUEST_VAULT',

  getGuestVault() {
    try {
      return JSON.parse(localStorage.getItem(this.VAULT_KEY) || '{"xp":0,"coins":0,"words":0}');
    } catch(e) {
      return {xp:0, coins:0, words:0};
    }
  },

  saveGuestVault(v) {
    try {
      localStorage.setItem(this.VAULT_KEY, JSON.stringify(v));
    } catch(e) {}
  },

  clearGuestVault() {
    localStorage.removeItem(this.VAULT_KEY);
  },

  getAll() {
    try {
      return JSON.parse(localStorage.getItem(this.DB_KEY) || '{}');
    } catch(e) {
      return {};
    }
  },

  saveAll(db) {
    try {
      localStorage.setItem(this.DB_KEY, JSON.stringify(db));
    } catch(e) {
      console.error('Database write error:', e);
    }
  },

  getCurrentUser() {
    try {
      const email = localStorage.getItem(this.CUR_KEY);
      if (!email) return null;
      const db = this.getAll();
      return db[email.toLowerCase()] || null;
    } catch(e) {
      return null;
    }
  },

  saveUser(user) {
    if (!user || !user.email) return;
    const db = this.getAll();
    db[user.email.toLowerCase()] = user;
    this.saveAll(db);
    this.syncUI();
  },

  register(email, pass, name) {
    email = (email || '').trim().toLowerCase();
    pass = (pass || '').trim();
    name = (name || '').trim();
    if (!email || !email.includes('@')) throw new Error('err_email');
    if (!pass || pass.length < 4) throw new Error('err_pass');

    const db = this.getAll();
    if (db[email]) throw new Error('err_exists');

    const existingIds = new Set(Object.values(db).map(u => u.id));
    const newId = genPlayerId(existingIds);
    const finalName = name || email.split('@')[0];

    const newUser = {
      id: newId,
      name: finalName,
      email: email,
      pass: pass,
      level: 1,
      xp: 0,
      coins: 100, // Hoş geldin bonusu
      skins: ['classic'],
      activeSkin: 'classic',
      stats: { wordsGuessed: 0, gamesWon: 0 },
      createdAt: new Date().toISOString()
    };

    db[email] = newUser;
    this.saveAll(db);
    localStorage.setItem(this.CUR_KEY, email);
    this.syncUI();
    applyActiveSkin('classic');
    return newUser;
  },

  login(email, pass) {
    email = (email || '').trim().toLowerCase();
    pass = (pass || '').trim();
    const db = this.getAll();
    const user = db[email];
    if (!user || user.pass !== pass) throw new Error('err_auth');

    localStorage.setItem(this.CUR_KEY, email);
    localStorage.setItem(this.LAST_KEY, email);
    localStorage.setItem('KA_REMEMBERED_LAST_ID', user.id);

    /* Çıkış yaptıktan sonra hafızada biriken ödülleri hesaba aktar */
    const gv = this.getGuestVault();
    if (gv.coins > 0 || gv.xp > 0) {
      user.coins = (user.coins || 0) + gv.coins;
      user.xp = (user.xp || 0) + gv.xp;
      if (!user.stats) user.stats = { wordsGuessed: 0, gamesWon: 0 };
      user.stats.wordsGuessed = (user.stats.wordsGuessed || 0) + (gv.words || 0);
      this.clearGuestVault();

      let req = this.reqXP(user.level || 1);
      while (user.xp >= req) {
        user.xp -= req;
        user.level = (user.level || 1) + 1;
        user.coins += user.level * 25;
        req = this.reqXP(user.level);
      }
      this.saveUser(user);
      const t = T_UI[lang] || T_UI.tr;
      setTimeout(() => {
        toast((t.vaultTransferred || '💾 Çıkış yaptıktan sonra biriken +{xp} XP ve +{coins} Coin hesabınıza aktarıldı! 🎉').replace('{xp}', gv.xp).replace('{coins}', gv.coins), 6000);
      }, 1000);
    }

    this.syncUI();
    applyActiveSkin(user.activeSkin || 'classic');
    return user;
  },

  logout() {
    const user = this.getCurrentUser();
    if (user && user.email) {
      localStorage.setItem(this.LAST_KEY, user.email);
      localStorage.setItem('KA_REMEMBERED_LAST_ID', user.id);
    }
    localStorage.removeItem(this.CUR_KEY);
    this.syncUI();
    applyActiveSkin('classic');
  },

  reqXP(lvl) {
    return 100 + (lvl - 1) * 60;
  },

  addReward(addXp, addCoins, source) {
    const user = this.getCurrentUser();
    if (!user) {
      /* Çıkış yapılmış olsa dahi hafızada biriktir ve kaydet */
      const gv = this.getGuestVault();
      gv.xp = (gv.xp || 0) + addXp;
      gv.coins = (gv.coins || 0) + addCoins;
      if (source === 'word') gv.words = (gv.words || 0) + 1;
      this.saveGuestVault(gv);

      if (sfx.coin) sfx.coin();
      const t = T_UI[lang] || T_UI.tr;
      const msg = (source === 'word') ? t.wordReward : t.matchReward;
      toast(msg.replace('{xp}', addXp).replace('{coins}', addCoins) + ' ' + (t.savedToMemory || '(Hafızaya Kaydedildi 💾)'), 4000);
      this.syncUI();
      return null;
    }

    user.xp = (user.xp || 0) + addXp;
    user.coins = (user.coins || 0) + addCoins;

    if (!user.stats) user.stats = { wordsGuessed: 0, gamesWon: 0 };
    if (source === 'word') user.stats.wordsGuessed = (user.stats.wordsGuessed || 0) + 1;
    if (source === 'match') user.stats.gamesWon = (user.stats.gamesWon || 0) + 1;

    let req = this.reqXP(user.level || 1);
    let didLvlUp = false;
    let bonusTotal = 0;

    while (user.xp >= req) {
      user.xp -= req;
      user.level = (user.level || 1) + 1;
      const lvlBonus = user.level * 25;
      user.coins += lvlBonus;
      bonusTotal += lvlBonus;
      didLvlUp = true;
      req = this.reqXP(user.level);
    }

    this.saveUser(user);

    if (sfx.coin) sfx.coin();

    const t = T_UI[lang] || T_UI.tr;
    if (didLvlUp) {
      if (sfx.levelUp) sfx.levelUp();
      confetti();
      toast(t.lvlUp + user.level + ' (+' + bonusTotal + ' Coin!) 🎉', 5000);
    } else {
      const msg = (source === 'word') ? t.wordReward : t.matchReward;
      toast(msg.replace('{xp}', addXp).replace('{coins}', addCoins), 3500);
    }

    return user;
  },

  buySkin(skinId) {
    const user = this.getCurrentUser();
    if (!user) throw new Error('ERR_LOGIN');
    const skin = SKINS_CATALOG.find(s => s.id === skinId);
    if (!skin) return user;
    if (user.skins && user.skins.includes(skinId)) return user;

    if ((user.coins || 0) < skin.price) throw new Error('ERR_COINS');

    user.coins -= skin.price;
    if (!user.skins) user.skins = ['classic'];
    user.skins.push(skinId);
    user.activeSkin = skinId;

    if (sfx.buy) sfx.buy();
    this.saveUser(user);
    applyActiveSkin(skinId);
    return user;
  },

  equipSkin(skinId) {
    const user = this.getCurrentUser();
    if (!user) throw new Error('ERR_LOGIN');
    if (!user.skins || !user.skins.includes(skinId)) throw new Error('ERR_OWN');

    user.activeSkin = skinId;
    this.saveUser(user);
    applyActiveSkin(skinId);
    return user;
  },

  syncUI() {
    const user = this.getCurrentUser();
    const t = T_UI[lang] || T_UI.tr;

    const userPill = $('#kaUserPill');
    const userIcon = $('#kaUserIcon');
    const userIdText = $('#kaUserIdText');
    const lvlWrap = $('#kaLvlWrap');
    const lvlText = $('#kaLvlText');
    const xpFill = $('#kaXpFill');
    const coinWrap = $('#kaCoinWrap');
    const coinsText = $('#kaCoinsText');
    const authBtnTxt = $('#kaAuthBtnTxt');
    const authBtn = $('#kaAuthBtn');

    if (user) {
      userIcon.textContent = '⭐';
      userIdText.textContent = (user.name || user.id);
      $('#profNameDisp').textContent = (user.name || user.email.split('@')[0]);
      lvlWrap.style.display = 'flex';
      lvlText.textContent = 'Lv.' + (user.level || 1);
      const req = this.reqXP(user.level || 1);
      const pct = Math.min(100, Math.round(((user.xp || 0) / req) * 100));
      xpFill.style.width = pct + '%';
      coinWrap.style.display = 'flex';
      coinsText.textContent = user.coins || 0;
      authBtnTxt.textContent = t.logout;
      authBtn.onclick = () => { AccountSystem.logout(); toast(t.logout); };

      $('#profId').textContent = user.id;
      $('#profEmail').textContent = user.email;
      $('#profLvl').textContent = 'Lv.' + (user.level || 1);
      $('#profXpFill').style.width = pct + '%';
      $('#profXpText').textContent = (user.xp || 0) + ' / ' + req + ' XP';
      $('#profCoins').textContent = '🪙 ' + (user.coins || 0) + ' Coin';
      $('#profWords').textContent = (user.stats && user.stats.wordsGuessed) || 0;
      $('#profWins').textContent = (user.stats && user.stats.gamesWon) || 0;
      $('#shopCoinBadge').textContent = '🪙 ' + (user.coins || 0) + ' Coin';
    } else {
      userIcon.textContent = '👤';
      userIdText.textContent = t.guest;
      lvlWrap.style.display = 'none';

      const gv = this.getGuestVault();
      if (gv && gv.coins > 0) {
        coinWrap.style.display = 'flex';
        coinsText.textContent = gv.coins;
        $('#shopCoinBadge').textContent = '🪙 ' + gv.coins + ' Coin (Hafıza)';
      } else {
        coinWrap.style.display = 'none';
        $('#shopCoinBadge').textContent = '🪙 0 Coin';
      }

      authBtnTxt.textContent = t.login;
      authBtn.onclick = () => openAuthModal();
    }

    renderShopGrid();
    refreshAll3DPlayerLabels();
  }
};

/* 6. KOSTÜM ÇİZİMİ (2D CANVAS & 3D ÜZERİNDE) */
function drawSkinTile(x, ch, st, skinId, turnColor) {
  x.clearRect(0, 0, 128, 128);

  if (skinId === 'gold') {
    const g = x.createRadialGradient(64, 64, 10, 64, 64, 80);
    if (st === 'c') { g.addColorStop(0, '#2d7a4d'); g.addColorStop(1, '#0e3a1f'); }
    else if (st === 'p') { g.addColorStop(0, '#e5aa24'); g.addColorStop(1, '#7a5405'); }
    else if (st === 'a') { g.addColorStop(0, '#3d342a'); g.addColorStop(1, '#1f1a14'); }
    else { g.addColorStop(0, '#544218'); g.addColorStop(1, '#241a05'); }
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);

    x.strokeStyle = (st==='f'||st==='h') ? '#fff099' : '#d4af37';
    x.lineWidth = (st==='f'||st==='h') ? 8 : 6;
    x.strokeRect(4, 4, 120, 120);

    x.strokeStyle = 'rgba(255, 235, 140, 0.4)';
    x.lineWidth = 2;
    x.strokeRect(10, 10, 108, 108);

    x.fillStyle = '#ffd700';
    [[8,8],[120,8],[8,120],[120,120]].forEach(([px,py])=>{
      x.beginPath(); x.arc(px,py,2.5,0,Math.PI*2); x.fill();
    });

    if (ch) {
      x.fillStyle = '#fff9e6';
      x.shadowColor = '#000000'; x.shadowBlur = 4; x.shadowOffsetX = 2; x.shadowOffsetY = 2;
      x.font = "700 80px Oswald,'Trebuchet MS',sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(ch, 64, 70);
      x.shadowColor = 'transparent';
    }
  } else if (skinId === 'neon') {
    if (st === 'c') x.fillStyle = '#05291e';
    else if (st === 'p') x.fillStyle = '#332906';
    else if (st === 'a') x.fillStyle = '#101520';
    else x.fillStyle = '#080d18';
    x.fillRect(0, 0, 128, 128);

    x.strokeStyle = 'rgba(0, 240, 255, 0.12)';
    x.lineWidth = 1;
    for (let i = 24; i < 128; i += 26) {
      x.beginPath(); x.moveTo(i, 4); x.lineTo(i, 124); x.stroke();
      x.beginPath(); x.moveTo(4, i); x.lineTo(124, i); x.stroke();
    }

    const neonColor = (st==='c') ? '#00ff88' : (st==='p') ? '#ffea00' : (st==='a') ? '#404c60' : (st==='f'||st==='h') ? '#ff0077' : '#00e5ff';
    x.strokeStyle = neonColor;
    x.lineWidth = (st==='f'||st==='h') ? 7 : 5;
    x.strokeRect(4, 4, 120, 120);

    x.fillStyle = neonColor;
    [[4,4],[118,4],[4,118],[118,118]].forEach(([cx,cy])=>{ x.fillRect(cx, cy, 6, 6); });

    if (ch) {
      x.shadowColor = neonColor; x.shadowBlur = 10;
      x.fillStyle = '#ffffff';
      x.font = "700 80px Oswald,'Trebuchet MS',sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(ch, 64, 70);
      x.shadowColor = 'transparent';
    }
  } else if (skinId === 'wood') {
    const g = x.createLinearGradient(0, 0, 0, 128);
    if (st === 'c') { g.addColorStop(0, '#2d5e2d'); g.addColorStop(1, '#1b3b1b'); }
    else if (st === 'p') { g.addColorStop(0, '#8c651e'); g.addColorStop(1, '#4a330a'); }
    else if (st === 'a') { g.addColorStop(0, '#2a221a'); g.addColorStop(1, '#17120e'); }
    else { g.addColorStop(0, '#52381f'); g.addColorStop(1, '#33200f'); }
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);

    x.fillStyle = 'rgba(0,0,0,0.15)';
    for (let i = 18; i < 120; i += 22) { x.fillRect(4, i, 120, 2); }

    x.strokeStyle = (st==='f'||st==='h') ? (turnColor||'#ffd700') : '#a88247';
    x.lineWidth = (st==='f'||st==='h') ? 8 : 6;
    x.strokeRect(4, 4, 120, 120);

    if (ch) {
      x.fillStyle = '#fff4de';
      x.shadowColor = '#1a0e05'; x.shadowBlur = 3; x.shadowOffsetX = 1; x.shadowOffsetY = 2;
      x.font = "700 80px Oswald,'Trebuchet MS',sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(ch, 64, 70);
      x.shadowColor = 'transparent';
    }
  } else if (skinId === 'diamond') {
    const g = x.createLinearGradient(0, 0, 128, 128);
    if (st === 'c') { g.addColorStop(0, '#108968'); g.addColorStop(1, '#064433'); }
    else if (st === 'p') { g.addColorStop(0, '#d1981b'); g.addColorStop(1, '#664906'); }
    else if (st === 'a') { g.addColorStop(0, '#253540'); g.addColorStop(1, '#121d24'); }
    else { g.addColorStop(0, '#1a4359'); g.addColorStop(1, '#091d28'); }
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);

    x.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(10, 10); x.lineTo(118, 118); x.stroke();
    x.beginPath(); x.moveTo(118, 10); x.lineTo(10, 118); x.stroke();

    x.strokeStyle = (st==='f'||st==='h') ? '#ffffff' : '#9eeeff';
    x.lineWidth = (st==='f'||st==='h') ? 7 : 5;
    x.strokeRect(4, 4, 120, 120);

    if (ch) {
      x.shadowColor = '#70e4ff'; x.shadowBlur = 8;
      x.fillStyle = '#ffffff';
      x.font = "700 80px Oswald,'Trebuchet MS',sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(ch, 64, 70);
      x.shadowColor = 'transparent';
    }
  } else if (skinId === 'magma') {
    if (st === 'c') x.fillStyle = '#1c4228';
    else if (st === 'p') x.fillStyle = '#613406';
    else if (st === 'a') x.fillStyle = '#1c1618';
    else x.fillStyle = '#140c10';
    x.fillRect(0, 0, 128, 128);

    x.strokeStyle = (st==='c') ? 'rgba(0, 255, 100, 0.4)' : 'rgba(255, 80, 0, 0.45)';
    x.lineWidth = 2.5;
    x.beginPath();
    x.moveTo(12, 20); x.lineTo(40, 50); x.lineTo(75, 45); x.lineTo(115, 80);
    x.moveTo(25, 100); x.lineTo(60, 75); x.lineTo(95, 110);
    x.stroke();

    x.strokeStyle = (st==='f'||st==='h') ? '#fff077' : (st==='c' ? '#00ff77' : '#ff5500');
    x.lineWidth = (st==='f'||st==='h') ? 8 : 5;
    x.strokeRect(4, 4, 120, 120);

    if (ch) {
      x.shadowColor = '#ff4400'; x.shadowBlur = 9;
      x.fillStyle = '#fff4e6';
      x.font = "700 80px Oswald,'Trebuchet MS',sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(ch, 64, 70);
      x.shadowColor = 'transparent';
    }
  } else {
    // Klasik
    x.fillStyle = COL[st]; x.fillRect(0, 0, 128, 128);
    x.strokeStyle = (st==="f"||st==="h") ? PC[turn] : (st==="e" ? "#2c5560" : "rgba(255,255,255,.4)");
    x.lineWidth = (st==="f"||st==="h") ? 9 : 6;
    x.strokeRect(4, 4, 120, 120);
    if (ch) {
      x.fillStyle = (st==="h") ? "rgba(255,255,255,.5)" : "#fff";
      x.font = "700 80px Oswald,'Trebuchet MS',sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(ch, 64, 70);
    }
  }
}

function applyActiveSkin(skinId) {
  const skin = SKINS_CATALOG.find(s => s.id === skinId) || SKINS_CATALOG[0];
  const mat = skin.mat;

  if (typeof tiles !== 'undefined' && tiles.length) {
    tiles.forEach((rw, r) => rw.forEach((t, c) => {
      if (t && t.m && t.m.material) {
        t.m.material.roughness = mat.roughness;
        t.m.material.metalness = mat.metalness;
        t.m.material.emissiveIntensity = mat.emissiveIntensity;
        t.m.material.needsUpdate = true;
      }
      if (t) paint(r, c, t.ch, t.st);
    }));
  }
}

/* paint fonksiyonunu özelleştir */
paint = function(r, c, ch, st) {
  if (!tiles || !tiles[r] || !tiles[r][c]) return;
  const t = tiles[r][c];
  t.ch = ch;
  t.st = st;
  const ctx = t.cn.getContext("2d");
  const user = AccountSystem.getCurrentUser();
  const currentSkinId = (user && user.activeSkin) ? user.activeSkin : 'classic';
  drawSkinTile(ctx, ch, st, currentSkinId, PC[turn]);
  t.tx.needsUpdate = true;
};

buildBoard = function() {
  _origBuildBoard();

  const skinId = (user && user.activeSkin) ? user.activeSkin : 'classic';

/* 8. ÖDÜL KANCALARI (REWARD HOOKS) */
/* Kural: Singleplayer veya Online 2P kazanıldığında XP & Coin ver.
   Local 2P modunda (NP === 2 && !isOnline) KESİNLİKLE ödül verilmez! */

/* A. Kelimeyi bildiğinde (Round Win) */
const _origShowGuessResult = showGuessResult;
showGuessResult = async function(g, res, r, won, pts) {
  await _origShowGuessResult(g, res, r, won, pts);
  if (won) {
    /* Local 2P modunda ödül yok */
    if (NP === 2 && !isOnline) return;

    /* Tek oyunculu VEYA Online modda kelimeyi bulan oyuncu bu cihazsa */
    const isMe = (!isOnline && NP === 1) || (isOnline && turn === localPlayer);
    if (isMe) {
      const earnedXP = 50 + Math.max(0, (6 - r) * 10);
      const earnedCoins = 25 + Math.max(0, (6 - r) * 5);
      AccountSystem.addReward(earnedXP, earnedCoins, 'word');
    }
  }
};

/* B. Maçı kazandığında (Match Finale Win) */
const _prevFinale = finale;
finale = function(f) {
  const res = _prevFinale(f);

  /* Local 2P modunda maç ödülü yok */
  if (NP === 2 && !isOnline) return res;

  const mxs = Math.max(...scores.slice(0, NP));
  let wins = [...Array(NP).keys()].filter(i => scores[i] === mxs);
  if (NP === 1 && mxs === 0) wins = [];
  if (f) wins = f.w;

  const isMeWinner = (!isOnline && NP === 1 && wins.includes(0)) || (isOnline && wins.includes(localPlayer));
  if (isMeWinner) {
    const earnedXP = isOnline ? 200 : 150;
    const earnedCoins = isOnline ? 150 : 100;
    setTimeout(() => {
      AccountSystem.addReward(earnedXP, earnedCoins, 'match');
    }, 1500);
  }
  return res;
};

function renderShopGrid() {
  const grid = $('#shopGrid');
  if (!grid) return;
  grid.innerHTML = '';

  const user = AccountSystem.getCurrentUser();
  const ownedSkins = (user && user.skins) ? user.skins : ['classic'];
  const activeSkin = (user && user.activeSkin) ? user.activeSkin : 'classic';
  const t = T_UI[lang] || T_UI.tr;

  SKINS_CATALOG.forEach(skin => {
    const isOwned = ownedSkins.includes(skin.id);
    const isActive = activeSkin === skin.id;
    const skinLocale = skin[lang] || skin.tr;

    const card = document.createElement('div');
    card.className = 'ka-skin-card' + (isActive ? ' active' : '');

    const cv = document.createElement('canvas');
    cv.className = 'ka-skin-preview';
    cv.width = 128; cv.height = 128;
    const cx = cv.getContext('2d');
    drawSkinTile(cx, 'A', 'c', skin.id, '#3aa5ff');

    const title = document.createElement('div');
    title.className = 'ka-skin-title';
    title.textContent = skinLocale.name;

    const desc = document.createElement('div');
    desc.className = 'ka-skin-desc';
    desc.textContent = skinLocale.desc;

    const btn = document.createElement('button');
    btn.className = 'ka-skin-btn';

    if (isActive) {
      btn.textContent = t.equipped;
      btn.style.background = '#00ff88';
      btn.style.color = '#081418';
      btn.disabled = true;
    } else if (isOwned) {
      btn.textContent = t.equip;
      btn.style.background = '#17323a';
      btn.style.color = '#fff';
      btn.style.border = '1px solid #2a5560';
      btn.onclick = () => {
        AccountSystem.equipSkin(skin.id);
        toast(skinLocale.name + ': ' + t.equipped);
      };
    } else {
      btn.textContent = t.buy + ' (' + skin.price + ' 🪙)';
      btn.style.background = 'linear-gradient(135deg,#d9a441,#94691e)';
      btn.style.color = '#081418';
      btn.onclick = () => {
        if (!user) {
          toast(t.loginToShop);
          openAuthModal();
          return;
        }
        try {
          AccountSystem.buySkin(skin.id);
          toast(skinLocale.name + ' ' + t.equipped);
        } catch(e) {
          if (e.message === 'ERR_COINS') toast(t.needCoins);
        }
      };
    }

    card.appendChild(cv);
    card.appendChild(title);
    card.appendChild(desc);
    card.appendChild(btn);
    grid.appendChild(card);
  });
}

/* 3D Karakterlerin Üstündeki İsmi ve Podyum Plakasını Güncelleme */
function update3DPlayerBadge(playerIndex, nameText, col) {
  if (typeof players === 'undefined' || !players || !players[playerIndex]) return;
  const p = players[playerIndex];
  const bgCol = col || (playerIndex === 0 ? "#2d7ff9" : "#f2994a");

  // 1. Karakterin başının üstündeki 3D isim etiketi (lb)
  if (p.userData && p.userData.lb) {
    const c = cv(512, Math.round(512 * 0.46 / 1.9));
    const x = c.getContext("2d");
    x.fillStyle = bgCol;
    rr(x, 4, 4, c.width - 8, c.height - 8, 18); x.fill();
    x.fillStyle = "#08141a";
    x.font = "700 40px Oswald,'Trebuchet MS',sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(nameText, c.width / 2, c.height / 2 + 3);
    p.userData.lb.material.map.dispose();
    p.userData.lb.material.map = new THREE.CanvasTexture(c);
    p.userData.lb.material.needsUpdate = true;
  }

  // 2. Karakterin podyumunun önündeki isim plakası (pl)
  if (p.userData && p.userData.pl) {
    const pc = cv(256, 96);
    const px = pc.getContext("2d");
    px.fillStyle = bgCol;
    px.fillRect(0, 0, 256, 96);
    px.fillStyle = "#08141a";
    px.font = "700 42px Oswald,sans-serif";
    px.textAlign = "center"; px.textBaseline = "middle";
    px.fillText(nameText, 128, 52);
    p.userData.pl.material.map.dispose();
    p.userData.pl.material.map = new THREE.CanvasTexture(pc);
    p.userData.pl.material.needsUpdate = true;
  }
}

function getPlayerNameForSlot(idx) {
  const anon = getAnonName();
  if (isOnline) {
    if (idx === localPlayer) {
      return getMyDisplayName();
    } else {
      const op = playerNames[idx];
      return (op && op !== 'Rakip' && op !== 'Oyuncu 1' && op !== 'Oyuncu 2') ? op : anon;
    }
  } else {
    if (idx === 0) {
      return getMyDisplayName();
    } else {
      const p2 = playerNames[1];
      return (p2 && p2 !== 'Oyuncu 2' && p2 !== 'Player 2') ? p2 : anon;
    }
  }
}

function refreshAll3DPlayerLabels() {
  update3DPlayerBadge(0, getPlayerNameForSlot(0), "#2d7ff9");
  update3DPlayerBadge(1, getPlayerNameForSlot(1), "#f2994a");
}

let hostSyncPeer = null;
let currentSyncCode = '';

/* A. 6 Haneli Canlı Eşleme Başlat (Bilgisayar Tarafı) */
function startLiveSync() {
  const user = AccountSystem.getCurrentUser();
  if (!user) { toast('Lütfen önce giriş yapın!'); return; }

  currentSyncCode = Math.floor(100000 + Math.random() * 900000).toString();
  $('#syncCodeDisp').textContent = currentSyncCode;
  $('#syncLiveStatus').textContent = '🟢 Telefonun bağlanması bekleniyor...';
  $('#syncLiveStatus').style.color = '#7ee0a5';

  if (hostSyncPeer) { try { hostSyncPeer.destroy(); } catch(e){} }

  try {
    const pid = 'kelimesync-' + currentSyncCode;
    hostSyncPeer = new Peer(pid);

    hostSyncPeer.on('connection', conn => {
      conn.on('open', () => {
        $('#syncLiveStatus').textContent = '📲 Telefona aktarılıyor...';
        conn.send({ t: 'sync_user', user });
        setTimeout(() => {
          $('#syncLiveStatus').textContent = '✅ Hesap başarıyla telefona aktarıldı!';
          $('#syncLiveStatus').style.color = '#ffd700';
          toast('✅ Hesabınız telefonunuza başarıyla aktarıldı! 🎉', 6000);
          confetti();
        }, 600);
      });
    });

    hostSyncPeer.on('error', err => {
      console.warn('Sync Peer error:', err);
      $('#syncLiveStatus').textContent = '🟡 Kod hazır, telefon bekleniyor.';
    });
  } catch(e) {
    console.error('Peer init error:', e);
  }
}

/* D. Telefonda Kodla Bağlan ve Aktar */
$('#btnDoDeviceSync').onclick = () => {
  const code = $('#kaSyncInCode').value.trim();
  $('#kaSyncInErr').textContent = '';

  if (!code || code.length !== 6) {
    $('#kaSyncInErr').textContent = 'Lütfen 6 haneli eşleme kodunu girin!';
    return;
  }

  $('#btnDoDeviceSync').disabled = true;
  $('#btnDoDeviceSync').textContent = 'Bağlanılıyor...';

  try {
    const clientPeer = new Peer();
    const timeout = setTimeout(() => {
      clientPeer.destroy();
      $('#btnDoDeviceSync').disabled = false;
      $('#btnDoDeviceSync').textContent = '🔗 Bağlan ve Hesabı Telefona Yükle';
      $('#kaSyncInErr').textContent = 'Zaman aşımı! Bilgisayardaki kodun açık olduğundan emin olun.';
    }, 12000);

    clientPeer.on('open', () => {
      const pid = 'kelimesync-' + code;
      const conn = clientPeer.connect(pid, { reliable: true });

      conn.on('open', () => {
        $('#btnDoDeviceSync').textContent = 'Veriler alınıyor...';
      });

      conn.on('data', d => {
        if (d && d.t === 'sync_user' && d.user) {
          clearTimeout(timeout);
          const user = d.user;
          const db = AccountSystem.getAll();
          db[user.email.toLowerCase()] = user;
          AccountSystem.saveAll(db);
          localStorage.setItem(AccountSystem.CUR_KEY, user.email.toLowerCase());
          AccountSystem.syncUI();
          applyActiveSkin(user.activeSkin || 'classic');

          clientPeer.destroy();
          $('#kaAccModal').classList.add('hide');
          $('#btnDoDeviceSync').disabled = false;
          $('#btnDoDeviceSync').textContent = '🔗 Bağlan ve Hesabı Telefona Yükle';

          confetti();
          if (sfx.win) sfx.win();
          toast('🎉 Hesabınız başarıyla telefona aktarıldı! Hoş geldin ' + (user.id || '') + '! 🎮', 7000);
        }
      });

      conn.on('error', err => {
        clearTimeout(timeout);
        clientPeer.destroy();
        $('#btnDoDeviceSync').disabled = false;
        $('#btnDoDeviceSync').textContent = '🔗 Bağlan ve Hesabı Telefona Yükle';
        $('#kaSyncInErr').textContent = 'Bağlantı hatası! Kodu kontrol edin.';
      });
    });

    clientPeer.on('error', err => {
      clearTimeout(timeout);
      clientPeer.destroy();
      $('#btnDoDeviceSync').disabled = false;
      $('#btnDoDeviceSync').textContent = '🔗 Bağlan ve Hesabı Telefona Yükle';
      $('#kaSyncInErr').textContent = 'Sunucuya bağlanılamadı! İnternet bağlantınızı kontrol edin.';
    });
  } catch(e) {
    $('#btnDoDeviceSync').disabled = false;
    $('#btnDoDeviceSync').textContent = '🔗 Bağlan ve Hesabı Telefona Yükle';
    $('#kaSyncInErr').textContent = 'Hata: ' + (e.message || 'Bilinmeyen hata');
  }
};

/* E. URL'de Magic Link ile Gelenleri Otomatik Giriş Yaptır */
(function checkMagicSyncLink() {
  const hash = window.location.hash || window.location.search || '';
  if (hash.includes('sync=')) {
    try {
      const m = hash.match(/sync=([^&]+)/);
      if (m && m[1]) {
        const payload = decodeURIComponent(m[1]);
        const user = JSON.parse(decodeURIComponent(atob(payload)));
        if (user && user.email) {
          const db = AccountSystem.getAll();
          db[user.email.toLowerCase()] = user;
          AccountSystem.saveAll(db);
          localStorage.setItem(AccountSystem.CUR_KEY, user.email.toLowerCase());
          AccountSystem.syncUI();
          applyActiveSkin(user.activeSkin || 'classic');

          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
          }

          setTimeout(() => {
            confetti();
            if (sfx.win) sfx.win();
            toast('🎉 Hesabınız bu cihaza başarıyla yüklendi! Hoş geldin ' + (user.id || '') + '! 🎮', 7000);
          }, 1000);
        }
      }
    } catch(e) {
      console.warn('Magic link parse error:', e);
    }
  }
})();

/* ====================== ŞİFRE SIFIRLAMA (GMAIL / DOĞRULAMA KODU) ====================== */
let resetSession = null;

/* EmailJS Gerçek E-posta Gönderim Ayarları */
const EMAILJS_CONFIG = {
  serviceId: 'service_06g72wc',       // örn: 'service_gmail' (EmailJS'ten alınır)
  templateId: 'it0er84',      // örn: 'template_reset'
  publicKey: 'D3hFooxOQORgJFdBD',       // örn: 'user_xyz123'
  senderEmail: 'dddorukgun@gmail.com'
};

async function sendEmailViaEmailJS(toEmail, code) {
  if (typeof emailjs === 'undefined') return false;
  if (!EMAILJS_CONFIG.publicKey || !EMAILJS_CONFIG.serviceId) {
    console.log('EmailJS anahtarları tanımlı değil, bildirim modu aktif.');
    return false;
  }
  try {
    emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });
    const res = await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
      to_email: toEmail,
      email: toEmail,
      user_email: toEmail,
      to_name: toEmail.split('@')[0],
      reset_code: code,
      code: code,
      sender: EMAILJS_CONFIG.senderEmail,
      from_name: 'Kelime Arenası',
      game_name: 'Kelime Arenası'
    });
    return res && res.status === 200;
  } catch (err) {
    console.warn('EmailJS gönderim hatası:', err);
    return false;
  }
}

/* Kod Gönder Butonu */
$('#kaBtnSendCode').onclick = () => {
  const email = $('#kaResetEmail').value.trim().toLowerCase();
  const t = T_UI[lang] || T_UI.tr;
  $('#kaResetErr1').textContent = '';

  if (!email || !email.includes('@')) {
    $('#kaResetErr1').textContent = t.err_email;
    return;
  }

  const db = AccountSystem.getAll();
  const user = db[email];
  if (!user) {
    $('#kaResetErr1').textContent = t.err_not_found;
    return;
  }

  /* 6 Haneli Güvenlik Kodu Üret */
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  resetSession = { email, code, expires: Date.now() + 15 * 60 * 1000 };

  /* 2. Adıma Geç */
  $('#kaResetStep1').style.display = 'none';
  $('#kaResetStep2').style.display = 'block';
  $('#kaResetSentNotice').textContent = t.codeSentTo.replace('{email}', email);
  $('#kaResetSentSub').textContent = t.checkSpam;
  $('#kaResetCode').value = '';
  $('#kaResetNewPass').value = '';
  $('#kaResetErr2').textContent = '';
  $('#kaResetCode').focus();

  if (sfx.key) sfx.key();

  /* Gerçek E-posta Gönderim Denemesi */
  sendEmailViaEmailJS(email, code).then(success => {
    if (success) {
      toast('✅ ' + EMAILJS_CONFIG.senderEmail + ' üzerinden ' + email + ' adresine gerçek e-posta iletildi!', 8000);
    } else {
      toast('📧 [GMAIL] ' + email + ' adresine kod gönderildi: ' + code + ' (15 dk geçerli)', 10000);
    }
  });
};

/* Şifreyi Yenile ve Giriş Yap Butonu */
$('#kaBtnDoReset').onclick = () => {
  const inputCode = $('#kaResetCode').value.trim();
  const newPass = $('#kaResetNewPass').value.trim();
  const t = T_UI[lang] || T_UI.tr;
  $('#kaResetErr2').textContent = '';

  if (!resetSession || Date.now() > resetSession.expires) {
    $('#kaResetErr2').textContent = t.err_expired;
    return;
  }
  if (inputCode !== resetSession.code) {
    $('#kaResetErr2').textContent = t.err_wrong_code;
    return;
  }
  if (!newPass || newPass.length < 4) {
    $('#kaResetErr2').textContent = t.err_pass;
    return;
  }

  /* Veritabanında şifreyi güncelle */
  const db = AccountSystem.getAll();
  if (db[resetSession.email]) {
    db[resetSession.email].pass = newPass;
    AccountSystem.saveAll(db);
    localStorage.setItem(AccountSystem.CUR_KEY, resetSession.email);
    AccountSystem.syncUI();

    $('#kaAccModal').classList.add('hide');
    confetti();
    if (sfx.coin) sfx.coin();
    toast(t.resetSuccess, 5000);
    resetSession = null;
  }
};
